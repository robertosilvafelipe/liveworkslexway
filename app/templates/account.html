{% extends "base.html" %}
{% block wrapclass %}narrow{% endblock %}
{% block content %}
<h1>Minha conta</h1>
<div class="grid cols-2">
  <div class="card">
    <h2>Dados</h2>
    <p><b>{{ user.name }}</b><br>Usuário <code>{{ user.username }}</code><br><span class="role-tag">{{ ROLES[user.role] }}</span></p>
    <form method="post" action="/account/email">
      <div class="field"><label>E-mail (para recuperar a senha)</label><input type="email" name="email" value="{{ user.email or '' }}" autocomplete="email"></div>
      <button class="btn teal">Salvar e-mail</button>
    </form>
  </div>
  <div class="card">
    <h2>Trocar senha</h2>
    <form method="post" action="/account">
      <div class="field"><label>Senha atual</label><input type="password" name="current" required autocomplete="current-password"></div>
      <div class="field"><label>Nova senha</label><input type="password" name="new" required minlength="8" autocomplete="new-password"></div>
      <div class="field"><label>Confirmar nova senha</label><input type="password" name="confirm" required minlength="8" autocomplete="new-password"></div>
      <button class="btn primary">Salvar senha</button>
    </form>
  </div>
</div>
{% endblock %}
