<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=9"><link rel="icon" href="/static/img/favicon.png"><meta name="theme-color" content="#005555"></head>
<body class="login-page">
<div class="login-card">
  <div class="login-brand"><img src="/static/img/lexway-logo.svg" alt="LexWay English">
    <h1>{% block heading %}Worksheets{% endblock %}</h1><p class="muted" style="margin:0">{% block sub %}Atividades de inglês com <em style="color:var(--accent);font-family:var(--serif);font-size:1.1em">presença real</em>{% endblock %}</p></div>
  {% for kind, msg in messages %}<div class="flash {{ kind }}">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div>
</body></html>
